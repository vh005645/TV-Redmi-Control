plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvguard.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvguard.app'
        minSdk 30
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }
    // Khoa ky CO DINH (luu trong repo): moi lan build tren GitHub deu cung chu ky,
    // nen cai de (adb install -r) khong can go app, khong mat quyen/cai dat.
    signingConfigs {
        debug {
            storeFile file('tvguard.keystore')
            storePassword 'tvguard123'
            keyAlias 'tvguard'
            keyPassword 'tvguard123'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
